name: CI - Waterdeep Watchtower

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  backend-unit-and-integration-tests:
    name: Backend Tests (Python ${{ matrix.python_version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python_version: [ "3.11", "3.12" ]

    steps:
      - name: Checkout repository source code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python_version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python_version }}
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest test suite
        run: |
          pytest -v

  frontend-build-and-typecheck:
    name: Frontend Build & Typecheck (Node.js 20)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository source code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install frontend dependencies
        run: |
          npm --prefix frontend ci

      - name: Build and typecheck React frontend
        run: |
          npm --prefix frontend run build

  contract-and-e2e-verification:
    name: Official ZAI Contract Verification (E1/E2)
    runs-on: ubuntu-latest
    needs: [ backend-unit-and-integration-tests, frontend-build-and-typecheck ]

    steps:
      - name: Checkout repository source code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install backend and frontend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          npm --prefix frontend ci
          npm --prefix frontend run build

      - name: Start FastAPI backend server in background
        run: |
          uvicorn backend.app.main:app --host 127.0.0.1 --port 8000 &
          # Oczekiwanie na gotowość endpointu health
          for attempt in $(seq 1 30); do
            if curl -s -f http://127.0.0.1:8000/api/health; then
              echo "Serwer API uruchomiony pomyślnie!"
              break
            fi
            sleep 0.5
          done

      - name: Seed database with sample telemetry data
        run: |
          python generator/seed_waterdeep.py http://127.0.0.1:8000 admin HasloAdministratora123!

      - name: Run official ZAI test suite (Stage E1)
        run: |
          node docs/zai-tests.mjs --app http://localhost:8000 --user admin --pass 'HasloAdministratora123!' --stage E1
